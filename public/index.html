
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novedades Mary | Catálogo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #8e44ad;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 10px;
        }

        .contenedor {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .controles {
            display: flex;
            gap: 12px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        .controles input {
            flex: 1;
            min-width: 200px;
        }

        .controles select {
            width: auto;
            min-width: 180px;
        }

        button {
            padding: 11px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.88;
        }

        .btn-agregar {
            background: #8e44ad;
            color: white;
            margin-bottom: 20px;
        }

        .btn-guardar {
            background: #27ae60;
            color: white;
        }

        .btn-cancelar {
            background: #7f8c8d;
            color: white;
        }

        .btn-editar {
            background: #2980b9;
            color: white;
            flex: 1;
        }

        .btn-eliminar {
            background: #e74c3c;
            color: white;
            flex: 1;
        }

        .productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 22px;
        }

        .producto {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }

        .producto:hover {
            transform: translateY(-5px);
        }

        .producto img {
            width: 100%;
            height: 190px;
            object-fit: contain;
            padding: 15px;
            background: white;
        }

        .informacion {
            padding: 15px;
        }

        .informacion h3 {
            margin-bottom: 10px;
            font-size: 17px;
        }

        .descripcion {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .categoria {
            font-size: 12px;
            color: #8e44ad;
            margin-bottom: 10px;
        }

        .precio {
            font-size: 20px;
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 8px;
        }

        .acciones {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        #mensaje {
            text-align: center;
            margin: 20px 0;
            color: #666;
        }

        .formulario {
            display: none;
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .formulario h2 {
            margin-bottom: 20px;
            color: #8e44ad;
        }

        .campos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .campo label {
            font-weight: bold;
            font-size: 14px;
        }

        .campo-completo {
            grid-column: 1 / -1;
        }

        .campo textarea {
            resize: vertical;
            min-height: 80px;
        }

        .botones-formulario {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 40px;
            background: #333;
            color: white;
        }

        @media (max-width: 600px) {
            .campos {
                grid-template-columns: 1fr;
            }

            .campo-completo {
                grid-column: auto;
            }

            .botones-formulario {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Novedades Mary</h1>
        <p>Un mundo de novedades en un solo lugar</p>
    </header>

    <main class="contenedor">

        <h2>Catálogo de productos</h2>

        <section class="controles">

            <input
                type="text"
                id="buscador"
                placeholder="Buscar productos..."
            >

            <select id="categoria">
                <option value="">Todas las categorías</option>
            </select>

        </section>

        <button class="btn-agregar" id="btn-nuevo">
            + Agregar producto
        </button>

        <!-- FORMULARIO DE REGISTRO Y EDICIÓN -->

        <section class="formulario" id="formulario">

            <h2 id="titulo-formulario">Registrar producto</h2>

            <form id="form-producto">

                <div class="campos">

                    <div class="campo">
                        <label for="nombre">Nombre del producto</label>
                        <input type="text" id="nombre" required minlength="2">
                    </div>

                    <div class="campo">
                        <label for="categoria-producto">Categoría</label>
                        <input type="text" id="categoria-producto" required>
                    </div>

                    <div class="campo">
                        <label for="precioVenta">Precio de venta</label>
                        <input type="number" id="precioVenta" min="0" step="0.01" required>
                    </div>

                    <div class="campo">
                        <label for="stock">Stock</label>
                        <input type="number" id="stock" min="0" step="1" required>
                    </div>

                    <div class="campo">
                        <label for="marca">Marca</label>
                        <input type="text" id="marca" placeholder="Marca del producto">
                    </div>

                    <div class="campo">
                        <label for="stockMinimo">Stock mínimo</label>
                        <input type="number" id="stockMinimo" min="0" step="1" value="5">
                    </div>

                    <div class="campo campo-completo">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion" maxlength="200"></textarea>
                    </div>

                    <div class="campo campo-completo">
                        <label for="imagen">URL de la imagen</label>
                        <input
                            type="url"
                            id="imagen"
                            placeholder="Pega aquí la URL de la imagen"
                        >
                    </div>

                    <div class="campo">
                        <label for="activo">Estado</label>
                        <select id="activo">
                            <option value="true">Activo</option>
                            <option value="false">Inactivo</option>
                        </select>
                    </div>

                </div>

                <div class="botones-formulario">

                    <button type="submit" class="btn-guardar" id="btn-guardar">
                        Guardar producto
                    </button>

                    <button type="button" class="btn-cancelar" id="btn-cancelar">
                        Cancelar
                    </button>

                </div>

            </form>

        </section>

        <p id="mensaje">Cargando productos...</p>

        <section class="productos" id="lista-productos">
        </section>

    </main>

    <footer>
        <p>Novedades Mary - Catálogo de productos</p>
        <p>Consumo de API REST propia con Node.js, Express y MongoDB</p>
    </footer>

    <script>

        const API_URL = '/api/productos';

        const listaProductos = document.getElementById('lista-productos');
        const mensaje = document.getElementById('mensaje');
        const buscador = document.getElementById('buscador');
        const categoria = document.getElementById('categoria');
        const formulario = document.getElementById('formulario');
        const formProducto = document.getElementById('form-producto');

        let todosLosProductos = [];
        let idProductoEditar = null;

        // GET: Obtener todos los productos

        async function cargarProductos() {

            try {

                mensaje.textContent = 'Cargando productos...';

                const respuesta = await fetch(API_URL);

                if (!respuesta.ok) {
                    throw new Error('No se pudieron cargar los productos');
                }

                const datos = await respuesta.json();

                todosLosProductos = datos.productos || [];

                cargarCategorias(todosLosProductos);
                filtrarProductos();

                mensaje.textContent = `Se encontraron ${datos.total} productos`;

            } catch (error) {

                mensaje.textContent = 'Error al cargar productos: ' + error.message;

            }

        }

        // Mostrar productos en pantalla

        function mostrarProductos(productos) {

            listaProductos.innerHTML = '';

            if (productos.length === 0) {
                listaProductos.innerHTML = '<p>No se encontraron productos.</p>';
                return;
            }

            productos.forEach(producto => {

                const tarjeta = document.createElement('article');
                tarjeta.classList.add('producto');

                const imagen = document.createElement('img');
                imagen.src = producto.imagen || '';
                imagen.alt = producto.nombre;
                imagen.onerror = function () {
                    this.style.display = 'none';
                };

                const informacion = document.createElement('div');
                informacion.classList.add('informacion');

                const nombre = document.createElement('h3');
                nombre.textContent = producto.nombre;

                const descripcion = document.createElement('p');
                descripcion.classList.add('descripcion');
                descripcion.textContent = producto.descripcion || 'Sin descripción';

                const categoriaTexto = document.createElement('p');
                categoriaTexto.classList.add('categoria');
                categoriaTexto.textContent = 'Categoría: ' + producto.categoria;

                const precio = document.createElement('p');
                precio.classList.add('precio');
                precio.textContent = '$' + Number(producto.precioVenta).toFixed(2);

                const stock = document.createElement('p');
                stock.textContent = 'Stock: ' + producto.stock;

                const marca = document.createElement('p');
                marca.textContent = 'Marca: ' + (producto.marca || 'Sin marca');

                const estado = document.createElement('p');
                estado.textContent = producto.activo ? 'Activo' : 'Inactivo';

                const acciones = document.createElement('div');
                acciones.classList.add('acciones');

                const btnEditar = document.createElement('button');
                btnEditar.classList.add('btn-editar');
                btnEditar.textContent = 'Editar';
                btnEditar.addEventListener('click', () => editarProducto(producto));

                const btnEliminar = document.createElement('button');
                btnEliminar.classList.add('btn-eliminar');
                btnEliminar.textContent = 'Eliminar';
                btnEliminar.addEventListener('click', () => eliminarProducto(producto._id));

                acciones.appendChild(btnEditar);
                acciones.appendChild(btnEliminar);

                informacion.appendChild(nombre);
                informacion.appendChild(descripcion);
                informacion.appendChild(categoriaTexto);
                informacion.appendChild(precio);
                informacion.appendChild(stock);
                informacion.appendChild(marca);
                informacion.appendChild(estado);
                informacion.appendChild(acciones);

                tarjeta.appendChild(imagen);
                tarjeta.appendChild(informacion);

                listaProductos.appendChild(tarjeta);

            });

        }

        // Cargar categorías

        function cargarCategorias(productos) {

            const categoriaActual = categoria.value;

            categoria.innerHTML = '<option value="">Todas las categorías</option>';

            const categorias = [
                ...new Set(productos.map(producto => producto.categoria))
            ];

            categorias.forEach(nombreCategoria => {

                const opcion = document.createElement('option');

                opcion.value = nombreCategoria;
                opcion.textContent = nombreCategoria;

                categoria.appendChild(opcion);

            });

            categoria.value = categorias.includes(categoriaActual)
                ? categoriaActual
                : '';

        }

        // Buscar y filtrar productos

        function filtrarProductos() {

            const texto = buscador.value.toLowerCase();
            const categoriaSeleccionada = categoria.value;

            const productosFiltrados = todosLosProductos.filter(producto => {

                const coincideNombre =
                    producto.nombre.toLowerCase().includes(texto);

                const coincideCategoria =
                    !categoriaSeleccionada ||
                    producto.categoria === categoriaSeleccionada;

                return coincideNombre && coincideCategoria;

            });

            mostrarProductos(productosFiltrados);

        }

        buscador.addEventListener('input', filtrarProductos);
        categoria.addEventListener('change', filtrarProductos);

        // Mostrar formulario para nuevo producto

        document.getElementById('btn-nuevo').addEventListener('click', () => {

            idProductoEditar = null;

            formProducto.reset();

            document.getElementById('titulo-formulario').textContent = 'Registrar producto';
            document.getElementById('btn-guardar').textContent = 'Guardar producto';
            document.getElementById('stockMinimo').value = 5;
            document.getElementById('activo').value = 'true';

            formulario.style.display = 'block';
            formulario.scrollIntoView({ behavior: 'smooth' });

        });

        // Cancelar formulario

        document.getElementById('btn-cancelar').addEventListener('click', () => {

            formulario.style.display = 'none';
            formProducto.reset();
            idProductoEditar = null;

        });

        // POST y PUT: Registrar o actualizar producto

        formProducto.addEventListener('submit', async (event) => {

            event.preventDefault();

            const producto = {

                nombre: document.getElementById('nombre').value.trim(),
                categoria: document.getElementById('categoria-producto').value.trim(),
                precioVenta: Number(document.getElementById('precioVenta').value),
                stock: Number(document.getElementById('stock').value),
                marca: document.getElementById('marca').value.trim() || 'Sin marca',
                descripcion: document.getElementById('descripcion').value.trim(),
                stockMinimo: Number(document.getElementById('stockMinimo').value),
                activo: document.getElementById('activo').value === 'true',
                imagen: document.getElementById('imagen').value.trim() || null

            };

            try {

                let respuesta;

                if (idProductoEditar) {

                    // PUT: Actualizar producto

                    respuesta = await fetch(`${API_URL}/${idProductoEditar}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(producto)
                    });

                } else {

                    // POST: Registrar producto

                    respuesta = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(producto)
                    });

                }

                const resultado = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(resultado.error || resultado.mensaje || 'Error al guardar el producto');
                }

                alert(resultado.mensaje || 'Operación realizada correctamente');

                formulario.style.display = 'none';
                formProducto.reset();
                idProductoEditar = null;

                await cargarProductos();

            } catch (error) {

                alert('Error: ' + error.message);

            }

        });

        // Preparar formulario para editar

        function editarProducto(producto) {

            idProductoEditar = producto._id;

            document.getElementById('titulo-formulario').textContent = 'Editar producto';
            document.getElementById('btn-guardar').textContent = 'Actualizar producto';

            document.getElementById('nombre').value = producto.nombre;
            document.getElementById('categoria-producto').value = producto.categoria;
            document.getElementById('precioVenta').value = producto.precioVenta;
            document.getElementById('stock').value = producto.stock;
            document.getElementById('marca').value = producto.marca || '';
            document.getElementById('descripcion').value = producto.descripcion || '';
            document.getElementById('stockMinimo').value = producto.stockMinimo ?? 5;
            document.getElementById('activo').value = String(producto.activo);
            document.getElementById('imagen').value = producto.imagen || '';

            formulario.style.display = 'block';
            formulario.scrollIntoView({ behavior: 'smooth' });

        }

        // DELETE: Eliminar producto

        async function eliminarProducto(id) {

            const confirmar = confirm('¿Estás seguro de que deseas eliminar este producto?');

            if (!confirmar) {
                return;
            }

            try {

                const respuesta = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                const resultado = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(resultado.error || resultado.mensaje || 'No se pudo eliminar el producto');
                }

                alert(resultado.mensaje || 'Producto eliminado correctamente');

                await cargarProductos();

            } catch (error) {

                alert('Error: ' + error.message);

            }

        }

        // Cargar catálogo al abrir la página

        cargarProductos();

    </script>

</body>
</html>
