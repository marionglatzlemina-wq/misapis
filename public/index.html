
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novedades Mary | Catálogo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #8e44ad;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 10px;
        }

        .contenedor {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .controles {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        input, select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input {
            flex: 1;
            min-width: 200px;
        }

        select {
            min-width: 180px;
        }

        .productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 22px;
        }

        .producto {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }

        .producto:hover {
            transform: translateY(-5px);
        }

        .producto img {
            width: 100%;
            height: 190px;
            object-fit: contain;
            padding: 15px;
            background: white;
        }

        .informacion {
            padding: 15px;
        }

        .informacion h3 {
            margin-bottom: 10px;
            font-size: 17px;
        }

        .descripcion {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .categoria {
            font-size: 12px;
            color: #8e44ad;
            margin-bottom: 10px;
        }

        .precio {
            font-size: 20px;
            font-weight: bold;
            color: #27ae60;
        }

        .calificacion {
            margin-top: 8px;
            color: #d69b00;
            font-size: 14px;
        }

        #mensaje {
            text-align: center;
            margin: 25px 0;
            color: #666;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 40px;
            background: #333;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>Novedades Mary</h1>
        <p>Un mundo de novedades en un solo lugar</p>
    </header>

    <main class="contenedor">

        <h2>Catálogo de productos</h2>

        <br>

        <section class="controles">

            <input
                type="text"
                id="buscador"
                placeholder="Buscar productos..."
            >

            <select id="categoria">
                <option value="">Todas las categorías</option>
            </select>

        </section>

        <p id="mensaje">Cargando productos...</p>

        <section class="productos" id="lista-productos">
        </section>

    </main>

    <footer>
        <p>Novedades Mary - Catálogo de productos</p>
        <p>Consumo de API REST con Node.js, Express y DummyJSON</p>
    </footer>

    <script>

        const API_URL = '/api/productos-externos';

        const listaProductos = document.getElementById('lista-productos');
        const mensaje = document.getElementById('mensaje');
        const buscador = document.getElementById('buscador');
        const categoria = document.getElementById('categoria');

        let todosLosProductos = [];

        // Obtener productos desde nuestra API
        async function cargarProductos() {

            try {

                mensaje.textContent = 'Cargando productos...';

                const respuesta = await fetch(API_URL);

                if (!respuesta.ok) {
                    throw new Error('No se pudieron cargar los productos');
                }

                const datos = await respuesta.json();

                todosLosProductos = datos.productos;

                mostrarProductos(todosLosProductos);
                cargarCategorias(todosLosProductos);

                mensaje.textContent = `Se encontraron ${datos.total} productos`;

            } catch (error) {

                mensaje.textContent = 'Error al cargar los productos: ' + error.message;

            }

        }

        // Mostrar productos en pantalla
        function mostrarProductos(productos) {

            listaProductos.innerHTML = '';

            if (productos.length === 0) {
                mensaje.textContent = 'No se encontraron productos.';
                return;
            }

            productos.forEach(producto => {

                const tarjeta = document.createElement('article');

                tarjeta.classList.add('producto');

                tarjeta.innerHTML = `
                    <img
                        src="${producto.thumbnail}"
                        alt="${producto.title}"
                    >

                    <div class="informacion">

                        <h3>${producto.title}</h3>

                        <p class="descripcion">
                            ${producto.description}
                        </p>

                        <p class="categoria">
                            Categoría: ${producto.category}
                        </p>

                        <p class="precio">
                            $${producto.price}
                        </p>

                        <p class="calificacion">
                            ★ ${producto.rating}
                        </p>

                    </div>
                `;

                listaProductos.appendChild(tarjeta);

            });

        }

        // Cargar categorías disponibles
        function cargarCategorias(productos) {

            const categorias = [
                ...new Set(productos.map(producto => producto.category))
            ];

            categorias.forEach(nombreCategoria => {

                const opcion = document.createElement('option');

                opcion.value = nombreCategoria;
                opcion.textContent = nombreCategoria;

                categoria.appendChild(opcion);

            });

        }

        // Buscar y filtrar productos
        function filtrarProductos() {

            const texto = buscador.value.toLowerCase();
            const categoriaSeleccionada = categoria.value;

            const productosFiltrados = todosLosProductos.filter(producto => {

                const coincideNombre =
                    producto.title.toLowerCase().includes(texto);

                const coincideCategoria =
                    !categoriaSeleccionada ||
                    producto.category === categoriaSeleccionada;

                return coincideNombre && coincideCategoria;

            });

            mostrarProductos(productosFiltrados);

        }

        buscador.addEventListener('input', filtrarProductos);

        categoria.addEventListener('change', filtrarProductos);

        // Ejecutar al abrir la página
        cargarProductos();

    </script>

</body>
</html>
